[project]
name = "nvox"
version = "0.1.0"
description = "Modular forensic and steganography analysis framework"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nvox contributors" }]
keywords = ["forensics", "steganography", "ctf", "security"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
image = ["pillow>=10.4", "numpy>=2.0"]
tui = ["textual>=0.70"]
docs = ["mkdocs-material>=9.5"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
nvox = "nvox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nvox"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/nvox"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
check_untyped_defs = true
